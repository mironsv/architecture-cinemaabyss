# Application Configuration
server.port=8000

# Service URLs (can be overridden by environment variables)
cinemaabyss.monolith-url=http://monolith:8080
cinemaabyss.movies-service-url=http://movies-service:8081
cinemaabyss.events-service-url=http://events-service:8082

# Feature Flags
cinemaabyss.gradual-migration=${GRADUAL_MIGRATION:false}
cinemaabyss.movies-migration-percent=${MOVIES_MIGRATION_PERCENT:0}

# Logging Configuration
logging.level.com.cinemaabyss.proxy=INFO
logging.level.com.cinemaabyss.proxy.service=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# RestTemplate Configuration
rest-template.timeout=5000
